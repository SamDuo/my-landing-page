    <style>
      html, body { margin: 0; padding: 0; background: #faf6f0; font-family: "Source Sans 3", -apple-system, system-ui, sans-serif; min-height: 100vh; }
      * { box-sizing: border-box; }
      a { color: inherit; text-decoration: none; }
      a:hover { text-decoration: underline; }

      /* ── Motion ──────────────────────────────────────────────────────────
         A scroll-driven reveal for long sections, and an entrance for the
         page container on route change. Both are opt-in through the classes
         motion.js adds, so with JS off, or under prefers-reduced-motion,
         everything renders at full opacity and nothing moves. */
      @media (prefers-reduced-motion: no-preference) {
        [data-reveal] {
          opacity: 0;
          transform: translateY(14px);
          transition: opacity 620ms cubic-bezier(0.22, 1, 0.36, 1),
                      transform 620ms cubic-bezier(0.22, 1, 0.36, 1);
          will-change: opacity, transform;
        }
        [data-reveal].is-revealed {
          opacity: 1;
          transform: none;
        }
        /* Stagger siblings so a run of cards cascades instead of snapping. */
        [data-reveal].d1 { transition-delay: 60ms; }
        [data-reveal].d2 { transition-delay: 120ms; }
        [data-reveal].d3 { transition-delay: 180ms; }
        [data-reveal].d4 { transition-delay: 240ms; }

        @keyframes sd-page-in {
          from { opacity: 0; transform: translateY(8px); }
          to   { opacity: 1; transform: none; }
        }
        .sd-page-in { animation: sd-page-in 460ms cubic-bezier(0.22, 1, 0.36, 1) both; }

        /* Hero: the plate settles, then the two lines of type arrive. */
        @keyframes sd-hero-plate {
          from { opacity: 0; transform: scale(1.06); }
          to   { opacity: 1; transform: scale(1); }
        }
        @keyframes sd-hero-type {
          from { opacity: 0; transform: translateY(12px); }
          to   { opacity: 1; transform: none; }
        }
        .sd-hero-img {
          animation: sd-hero-plate 1400ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .sd-hero-eyebrow {
          animation: sd-hero-type 700ms cubic-bezier(0.22, 1, 0.36, 1) 220ms both;
        }
        .sd-hero-line {
          animation: sd-hero-type 820ms cubic-bezier(0.22, 1, 0.36, 1) 340ms both;
        }
      }

      /* The hero band is decoration: keep it out of the way of long text. */
      .sd-hero { contain: paint; }

      /* The about header is a two-column flex row at every width, so on a
         phone the portrait overlapped the name and squeezed the intro into a
         one-word column. Stack it below 720px. These need !important because
         the component sets flexDirection and order as inline styles. */
      @media (max-width: 720px) {
        .sd-about-header {
          flex-direction: column !important;
          gap: 1.8rem !important;
        }
        .sd-about-aside { order: 1 !important; align-self: flex-start; }
        .sd-about-main  { order: 2 !important; width: 100%; }

        /* The CV rows are a 3-column grid (dates | rail | content), which is
           far too narrow on a phone. Collapse to one column and hide the rail. */
        .sd-tl-row {
          grid-template-columns: 1fr !important;
          gap: 0.5rem !important;
        }
        .sd-tl-row > div:first-child { text-align: left !important; }
        .sd-tl-row > div:nth-child(2) { display: none !important; }

        /* Skills rows are "220px 1fr"; at 390px that leaves too little for the
           chips and the widest one pushes the page sideways. */
        .sd-skill-row {
          grid-template-columns: 1fr !important;
          gap: 0.5rem !important;
        }
      }

      /* Project cards: the image settles back as the card lifts. */
      .proj-card img { transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1); }
      @media (prefers-reduced-motion: no-preference) {
        .proj-card:hover img { transform: scale(1.035); }
      }
    </style>

    <script src="portfolio-data.js?v=2026-09-28"></script>

    </script>
    <script src="motion.js?v=2026-09-28" defer></script>
  </body>
