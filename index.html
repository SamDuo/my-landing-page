    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&family=Source+Sans+3:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; padding: 0; background: #faf6f0; font-family: "Source Sans 3", -apple-system, system-ui, sans-serif; min-height: 100vh; }
      * { box-sizing: border-box; }
      a { color: inherit; text-decoration: none; }
      a:hover { text-decoration: underline; }

      /* ── Motion ──────────────────────────────────────────────────────────
         All entrances are driven by GSAP in motion.js using gsap.from(),
         which animates from a synthetic start state to the element's natural
         state. Nothing here hides content: if the scripts fail to load, or
         the visitor prefers reduced motion, the page renders complete and
         static. That is deliberate — there is no "stuck invisible" state. */

      /* The hero band is decoration: keep it out of the way of long text. */
      .sd-hero { contain: paint; }
      .sd-hero-img { will-change: transform; }

      /* The about header is a two-column flex row at every width, so on a
         phone the portrait overlapped the name and squeezed the intro into a
         one-word column. Stack it below 720px. These need !important because
         the component sets flexDirection and order as inline styles. */
      @media (max-width: 720px) {
        .sd-about-header {
          flex-direction: column !important;
          gap: 1.8rem !important;
        }
        .sd-about-aside { order: 1 !important; align-self: flex-start; }
        .sd-about-main  { order: 2 !important; width: 100%; }

        /* The CV rows are a 3-column grid (dates | rail | content), which is
           far too narrow on a phone. Collapse to one column and hide the rail. */
        .sd-tl-row {
          grid-template-columns: 1fr !important;
          gap: 0.5rem !important;
        }
        .sd-tl-row > div:first-child { text-align: left !important; }
        .sd-tl-row > div:nth-child(2) { display: none !important; }

        /* Skills rows are "220px 1fr"; at 390px that leaves too little for the
           chips and the widest one pushes the page sideways. */
        .sd-skill-row {
          grid-template-columns: 1fr !important;
          gap: 0.5rem !important;
        }

        /* Four stats across is unreadable on a phone. */
        .sd-stats > div { grid-template-columns: repeat(2, 1fr) !important; }
      }

      /* Project cards: the image settles back as the card lifts. */
      .proj-card img { transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1); }
      @media (prefers-reduced-motion: no-preference) {
        .proj-card:hover img { transform: scale(1.035); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React 18.3.1 production builds, vendored so the page has no CDN
         dependency at runtime and keeps working if unpkg is unreachable. -->
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>

    <!-- GSAP 3.13 + ScrollTrigger drive every entrance and the scroll
         choreography, vendored for the same reason as React. Both are
         optional: motion.js bails out cleanly if either is missing. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/ScrollTrigger.min.js"></script>

    <script src="portfolio-data.js?v=2026-09-28"></script>
    <!-- Precompiled from portfolio.jsx. Regenerate with: npm run build -->
    <script src="portfolio.js?v=2026-09-28"></script>

    <script>
      ReactDOM.createRoot(document.getElementById("root")).render(
        React.createElement(Portfolio, { variant: "warm" })
      );
    </script>
    <script src="motion.js?v=2026-09-28" defer></script>
  </body>
</html>
